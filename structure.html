
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First Web Structure</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f5;
        }

        header {
            background-color: #eadcff;
            color: #663399;
            padding: 20px;
            margin: 10px;
            border: 2px solid #a66cff;
            border-radius: 10px;
        }

        nav {
            background-color: #d6ebff;
            padding: 15px;
            margin: 10px;
            border: 2px solid #55aaff;
            border-radius: 10px;
        }

        nav a {
            margin: 15px;
            color: #245b91;
            text-decoration: none;
        }

        main {
            background-color: #d9f2e8;
            padding: 20px;
            margin: 10px;
            border: 2px solid #55b99c;
            border-radius: 10px;
        }

        article {
            background-color: #ffe1d6;
            padding: 20px;
            margin: 10px;
            border: 2px solid #e87950;
            border-radius: 10px;
        }

        section {
            background-color: #e5ddff;
            padding: 20px;
            margin: 10px;
            border: 2px solid #9771dd;
            border-radius: 10px;
        }

        aside {
            background-color: #d6ebff;
            padding: 20px;
            margin: 10px;
            border: 2px solid #55aaff;
            border-radius: 10px;
        }

        footer {
            background-color: #ccebe5;
            color: #286b60;
            padding: 20px;
            margin: 10px;
            border: 2px solid #55aa99;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>My Website</h1>
        <p>Welcome to my website</p>
    </header>

    <!-- Navigation Menu -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Main Content -->
    <main>

        <!-- Article Content -->
        <article>
            <h2>About Me</h2>
            <p>My name is Sari. I am a CSE student.</p>
        </article>

        <!-- Section Content -->
        <section>
            <h2>My Education</h2>
            <p>I study Computer Science and Engineering.</p>
        </section>

        <!-- Additional Information -->
        <aside>
            <h3>My Interests</h3>
            <p>Programming, Technology, and AI.</p>
        </aside>

    </main>

    <!-- Website Footer -->
    <footer>
        <p>Copyright 2026 My Website</p>
    </footer>

</body>
</html>
